name: ci
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # The README's release links are checked on a `v*` tag, in release.yml
      # (scripts/check-readme-version.sh); its crates.io badge is live.
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # The lib as the desktop app uses it: no clap, ratatui or qrcode.
      - run: cargo clippy --lib --no-default-features -- -D warnings
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The release build's static C runtime flag (see release.yml), so the
    # Windows tests and import check see tmpmail.exe linked as it ships. Only
    # applies to the windows-msvc target. Without --target it also reaches
    # build scripts, which is harmless. A RUSTFLAGS variable would override it;
    # the import check then fails.
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo build --release
      - name: Check tmpmail.exe needs no C runtime DLLs
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-windows-imports.ps1 target/release/tmpmail.exe
      # Runs the real binary without network, to catch crashes in path, state
      # or terminal handling on each OS. Bash is Git Bash on Windows.
      - name: Run the binary offline
        shell: bash
        run: |
          bin="$PWD/target/release/tmpmail"
          tmp="$(mktemp -d)"
          if [ "$RUNNER_OS" = Windows ]; then
            bin="$bin.exe"
            tmp="$(cygpath -w "$tmp")"
          fi
          export TMPMAIL_STATE_DIR="$tmp/state" TMPMAIL_CONFIG="$tmp/no-config.toml"
          set -x
          "$bin" --version
          "$bin" --help >/dev/null
          "$bin" completions bash >/dev/null
          "$bin" man -o "$tmp/man" >/dev/null
          "$bin" providers
          "$bin" inboxes
          "$bin" --json inboxes
