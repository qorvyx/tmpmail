# Installs a published release's command-line .deb and .rpm on native amd64
# and arm64 runners, in containers of the systems the README names, and checks
# what the package puts in place. Run by hand after a release:
#
#   gh workflow run package-test.yml -f tag=v0.3.7
name: Package test

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag of the command-line tool, e.g. v0.3.7"
        required: true

permissions:
  contents: read

jobs:
  install:
    name: ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        image:
          - debian:12
          - ubuntu:22.04
          - ubuntu:24.04
          - fedora:latest
          - rockylinux/rockylinux:9
          - opensuse/tumbleweed
    steps:
      - name: Download and check the package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          ARCH: ${{ matrix.arch }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::tag must look like v0.3.7"; exit 1
          fi
          v=${TAG#v}
          case "$IMAGE" in
            debian*|ubuntu*) [ "$ARCH" = amd64 ] && f="tmpmail-cli_${v}_amd64.deb" || f="tmpmail-cli_${v}_arm64.deb" ;;
            *) [ "$ARCH" = amd64 ] && f="tmpmail-cli-$v-1.x86_64.rpm" || f="tmpmail-cli-$v-1.aarch64.rpm" ;;
          esac
          mkdir pkg && cd pkg
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$f" --pattern SHA256SUMS
          line=$(awk -v f="$f" '$2 == f' SHA256SUMS)
          [ -n "$line" ] || { echo "::error::$f is not in SHA256SUMS"; exit 1; }
          printf '%s\n' "$line" | sha256sum -c -
          echo "FILE=$f" >> "$GITHUB_ENV"
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Install, check, remove
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          cat > pkg/check.sh <<'EOF'
          set -eu
          cd /pkg
          case "$FILE" in
            *.deb)
              # Container images leave out man pages; a real system has them.
              rm -f /etc/dpkg/dpkg.cfg.d/excludes
              # Ubuntu's image also swaps man for a "minimized" stub.
              if dpkg-divert --list /usr/bin/man | grep -q .; then
                rm -f /usr/bin/man
                dpkg-divert --quiet --local --rename --remove /usr/bin/man
              fi
              apt-get update -qq
              apt-get install -y -qq "./$FILE" man-db >/dev/null
              zsh_dir=/usr/share/zsh/vendor-completions
              remove() { apt-get remove -y -qq tmpmail-cli >/dev/null; } ;;
            *.rpm)
              if command -v zypper >/dev/null; then
                mkdir -p /etc/zypp/zypp.conf.d
                echo 'rpm.install.excludedocs = no' > /etc/zypp/zypp.conf.d/zz-docs.conf
                zypper --non-interactive install --allow-unsigned-rpm "./$FILE" man >/dev/null
                remove() { zypper --non-interactive remove tmpmail-cli >/dev/null; }
              else
                dnf install -y -q --setopt=tsflags= "./$FILE" man-db
                remove() { dnf remove -y -q tmpmail-cli; }
              fi
              zsh_dir=/usr/share/zsh/site-functions ;;
          esac
          echo "== $(uname -m), $(. /etc/os-release; echo "$PRETTY_NAME")"
          # Resolved: where /usr/sbin links to /usr/bin (Fedora), command -v finds it first.
          [ "$(readlink -f "$(command -v tmpmail)")" = /usr/bin/tmpmail ]
          tmpmail --version
          tmpmail --version | grep -qxF "tmpmail $VERSION"
          tmpmail --help >/dev/null
          tmpmail providers >/dev/null
          tmpmail completions bash >/dev/null
          test -f /usr/share/bash-completion/completions/tmpmail
          test -f "$zsh_dir/_tmpmail"
          test -f /usr/share/fish/vendor_completions.d/tmpmail.fish
          test -f /usr/share/man/man1/tmpmail.1.gz
          MANPAGER=cat man tmpmail | grep -q tmpmail
          test -f /usr/share/doc/tmpmail-cli/LICENSE
          remove
          # (`! cmd` never stops a `set -e` script, so test with if; test the
          # file, since bash's `command -v` can answer from its cache.)
          if [ -e /usr/bin/tmpmail ]; then echo "still installed"; exit 1; fi
          if [ -e /usr/share/man/man1/tmpmail.1.gz ]; then echo "man page left"; exit 1; fi
          echo "ok"
          EOF
          docker run --rm -v "$PWD/pkg:/pkg" -e FILE -e VERSION "$IMAGE" sh /pkg/check.sh
