# Builds release archives, and .deb and .rpm packages for Linux, on a `v*`
# tag and publishes them as a GitHub release with SHA256SUMS. Every file
# gets a build provenance attestation, checked with `gh attestation verify
# FILE --repo qorvyx/tmpmail --signer-workflow qorvyx/tmpmail/.github/workflows/release.yml`.
# Running it by hand (workflow_dispatch) only builds, as a dry run, even when
# started on a tag: nothing is attested, published or pushed then.
# `gui-v*` tags (the desktop app) don't match `v*`, so they don't run it.
# Actions are pinned by commit SHA, with the tag in a comment. The jobs that
# compile have a read-only token; the attestations, the release and the
# Homebrew push happen in jobs that compile nothing, as in gui-release.yml.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Stops before any build if the tag isn't the crate's version (`v0.3.0`
  # for `version = "0.3.0"` in the root Cargo.toml), or if Cargo.lock is
  # stale (every build runs `--locked`).
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches Cargo.toml
        shell: bash
        run: |
          cargo metadata --locked --format-version 1 >/dev/null
          crate=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "tmpmail") | .version')
          if [ -z "$crate" ]; then
            echo "::error::no tmpmail package in the root Cargo.toml"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "Not a tag; Cargo.toml says $crate"
            exit 0
          fi
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match Cargo.toml version $crate"
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches Cargo.toml"
      # The README names the released version (the attestation example, the
      # install URL and its tar path, the .deb and .rpm names, the library's
      # `version = "X.Y"`).
      # Between releases it rightly still names the last one, so this only
      # runs on a tag, where every one of them must be the tag's version.
      - name: README names the tag's version
        if: github.ref_type == 'tag'
        shell: bash
        run: ./scripts/check-readme-version.sh "${GITHUB_REF_NAME#v}" README.md
  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-31
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # Links the C runtime into tmpmail.exe, so it starts on a Windows without
      # the Visual C++ Redistributable. Target-scoped, so the other matrix
      # entries (and crates.io builds) are unaffected; set here rather than in
      # a repo .cargo/config.toml so local builds aren't changed either. A
      # RUSTFLAGS variable would override it; the import check then fails.
      - run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
      - name: Check tmpmail.exe needs no C runtime DLLs
        if: contains(matrix.target, 'windows')
        shell: pwsh
        run: ./scripts/check-windows-imports.ps1 target/${{ matrix.target }}/release/tmpmail.exe
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="dev"
          name="tmpmail-$version-$TARGET"
          echo "ARCHIVE_DIR=$name" >> "$GITHUB_ENV"
          mkdir "$name"
          cp README.md LICENSE "$name/"
          if [[ "$TARGET" == *windows* ]]; then
            cp "target/$TARGET/release/tmpmail.exe" "$name/"
            7z a -bd "$name.zip" "$name" >/dev/null
          else
            cp "target/$TARGET/release/tmpmail" "$name/"
            tar czf "$name.tar.gz" "$name"
          fi
          ls -l tmpmail-*.*
      # The .deb and .rpm (package `tmpmail-cli`; the desktop app's are
      # `tmpmail`), from the binary the tarball above holds: nothing is
      # compiled again. nfpm packs prebuilt files into both formats from one
      # config (packaging/nfpm.yaml); it is a pinned release binary, checked
      # against its checksum before it runs. Each runner runs its own binary
      # here, for the man pages and completions.
      - name: Linux packages
        if: contains(matrix.target, 'linux')
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          NFPM_VERSION: 2.48.0
        run: |
          case "$(uname -m)" in
            x86_64) nfpm_arch=x86_64 nfpm_sum=6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750 ;;
            aarch64) nfpm_arch=arm64 nfpm_sum=a9a75213763783b7669719e505474c748c5ad7dc66591a195619deb50f85c2f4 ;;
            *) echo "::error::no nfpm checksum for $(uname -m)"; exit 1 ;;
          esac
          tools="$RUNNER_TEMP/nfpm"
          mkdir -p "$tools"
          tgz="$tools/nfpm.tar.gz"
          curl -fsSL --retry 3 -o "$tgz" \
            "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/nfpm_${NFPM_VERSION}_Linux_$nfpm_arch.tar.gz"
          echo "$nfpm_sum  $tgz" | sha256sum -c -
          tar xzf "$tgz" -C "$tools" nfpm
          case "$TARGET" in
            x86_64-*) deb_arch=amd64 rpm_arch=x86_64 ;;
            aarch64-*) deb_arch=arm64 rpm_arch=aarch64 ;;
            *) echo "::error::no package architecture for $TARGET"; exit 1 ;;
          esac
          # A dry run has no tag; a .deb version must start with a digit, so
          # it takes Cargo.toml's.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name == "tmpmail") | .version')
          fi
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage/man" "$stage/completions"
          cp "$ARCHIVE_DIR/tmpmail" "$ARCHIVE_DIR/README.md" "$ARCHIVE_DIR/LICENSE" "$stage/"
          cp packaging/copyright "$stage/"
          "$stage/tmpmail" man --output "$stage/man"
          gzip -9n "$stage"/man/*.1
          "$stage/tmpmail" completions bash > "$stage/completions/tmpmail"
          "$stage/tmpmail" completions zsh > "$stage/completions/_tmpmail"
          "$stage/tmpmail" completions fish > "$stage/completions/tmpmail.fish"
          deb="$GITHUB_WORKSPACE/tmpmail-cli_${version}_$deb_arch.deb"
          rpm="$GITHUB_WORKSPACE/tmpmail-cli-$version-1.$rpm_arch.rpm"
          export PKG_VERSION="$version" PKG_ARCH="$deb_arch"
          # The files' times inside the packages: the commit's.
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          cd "$stage"
          "$tools/nfpm" pkg --config "$GITHUB_WORKSPACE/packaging/nfpm.yaml" --packager deb --target "$deb"
          "$tools/nfpm" pkg --config "$GITHUB_WORKSPACE/packaging/nfpm.yaml" --packager rpm --target "$rpm"
          ls -l "$deb" "$rpm"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: |
            tmpmail-*.tar.gz
            tmpmail-*.zip
            tmpmail-cli_*.deb
            tmpmail-cli-*.rpm
          if-no-files-found: error

  release:
    needs: build
    # A tag push only: a manual run is a dry run even when started on a tag.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      # Exactly the five archives and four Linux packages the build jobs
      # make, nothing else, so nothing extra is attested or published.
      - name: Check the archives
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          expected=$(printf '%s\n' \
            "tmpmail-$v-aarch64-apple-darwin.tar.gz" \
            "tmpmail-$v-aarch64-unknown-linux-musl.tar.gz" \
            "tmpmail-$v-x86_64-apple-darwin.tar.gz" \
            "tmpmail-$v-x86_64-pc-windows-msvc.zip" \
            "tmpmail-$v-x86_64-unknown-linux-musl.tar.gz" \
            "tmpmail-cli_${v}_amd64.deb" \
            "tmpmail-cli_${v}_arm64.deb" \
            "tmpmail-cli-$v-1.x86_64.rpm" \
            "tmpmail-cli-$v-1.aarch64.rpm")
          found=$(cd dist && ls -A | LC_ALL=C sort)
          if [ "$found" != "$(echo "$expected" | LC_ALL=C sort)" ]; then
            echo "::error::dist/ holds other files than the five archives and four packages:"
            echo "$found"
            exit 1
          fi
      - run: cd dist && sha256sum tmpmail-* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/tmpmail-*
            dist/SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          --title "tmpmail ${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS

  # Updates Formula/tmpmail.rb in qorvyx/homebrew-tap. Needs the
  # HOMEBREW_TAP_TOKEN secret: a fine-grained token with contents write access
  # to that repository only. The token is given to the push alone (in its
  # URL, from the environment), never stored in a checkout's .git/config.
  homebrew:
    needs: release
    runs-on: ubuntu-latest
    # Shared with gui-release.yml's cask job: a v* and a gui-v* tag pushed
    # together would otherwise both push to the tap from the same HEAD.
    concurrency:
      group: homebrew-tap
      cancel-in-progress: false
    env:
      TAP: qorvyx/homebrew-tap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SHA256SUMS
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.TAP }}
          path: tap
          persist-credentials: false
      - run: |
          scripts/homebrew-formula.sh "${GITHUB_REF_NAME#v}" SHA256SUMS > tap/Formula/tmpmail.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/tmpmail.rb
          git commit -m "tmpmail ${GITHUB_REF_NAME#v}"
      # The only step that sees the token.
      - env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        working-directory: tap
        run: git push "https://x-access-token:${TAP_TOKEN}@github.com/${TAP}.git" HEAD
